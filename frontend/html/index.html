<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipDrop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav>
        <h2>ClipDrop</h2>
    </nav>

    <section class="hero">

        <h1>Transfer files and links<br>between any device.</h1>

        <p>
            No account required. Upload, get a code, and download on another device.
        </p>

        <div class="buttons">

    <a href="/upload" class="btn">
        📁 Send File
    </a>

    <a href="/clipboard" class="btn">
        📋 Send Text
    </a>

</div>

<div class="divider">
    <span>OR</span>
</div>

<div class="receive-section">

    <p>Already have a transfer code?</p>

    <a href="/receive" class="btn secondary">
        📥 Retrieve Transfer
    </a>

</div>

    </section>

</body>
</html>
