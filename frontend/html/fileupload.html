<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File - ClipDrop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>ClipDrop</h2>
</nav>

<section class="hero">

    <h1>Upload a file</h1>

    <p>
        Choose a file from your device. We'll generate a code that you can use to
        download it on another device.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <label class="upload-box">

            <input type="file" name="file" id="file" required>

            <div class="upload-content">
                <div class="icon">📁</div>

                <h3 id="filename">Choose a file</h3>

                <p>Click anywhere in this box to browse</p>
            </div>

        </label>

        <button class="submit-btn" type="submit">
            Upload File
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Home
    </a>

</section>

<script>

const fileInput = document.getElementById("file");
const filename = document.getElementById("filename");

fileInput.addEventListener("change", function(){

    if(this.files.length > 0){
        filename.textContent = this.files[0].name;
    }

});

</script>

</body>
</html>
