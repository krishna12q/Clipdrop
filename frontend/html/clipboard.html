<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Text - ClipDrop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>ClipDrop</h2>
</nav>

<section class="hero">

    <h1>Send text</h1>

    <p>
        Paste any text, code, links, or notes. We'll generate a transfer code that can be opened on another device.
    </p>

    <form action="/clipboard" method="POST">

        <textarea
            name="text"
            placeholder="Paste or type anything here..."
            maxlength="10000"
            required
        ></textarea>

        <button class="submit-btn" type="submit">
            Generate Transfer Code
        </button>

    </form>
    <a href="/" class="back">
        ← Back to Home
    </a>

</section>

</body>
</html>
